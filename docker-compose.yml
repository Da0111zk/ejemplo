name: clase-productos
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: productos_docker_base
      MYSQL_USER: demo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u demo productos_docker_base -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    image: productos-clase:1.0
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: "jdbc:mysql://mysql:3306/productos_docker_base?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      DB_USER: demo
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:-Q2xhdmVEZURlbW9QYXJhSmF2YU5vYmVDb25Eb2NrZXIyMDI2IQ==}
      JWT_EXPIRATION_MS: 300000
      DEMO_USERNAME: admin
      DEMO_PASSWORD: ${DEMO_PASSWORD:-1234}
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
