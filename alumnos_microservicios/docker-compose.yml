# PLANTILLA: agregar los cuatro proyectos indicados en LEEME.txt antes de ejecutar.
name: alumnos-microservicios
services:
  productos:
    image: clase-productos:1.0
    build:
      context: ./microservicios/productos  # Carpeta con pom.xml y src.
      dockerfile: Dockerfile  # Ruta relativa al context, no al endpoint.
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-productos:3306/productos_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: demo
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    depends_on:
      mysql-productos:
        condition: service_healthy

  mysql-productos:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: productos_db
      MYSQL_USER: demo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - datos_productos:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u demo productos_db -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  usuarios:
    image: clase-usuarios:1.0
